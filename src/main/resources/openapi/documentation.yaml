openapi: "3.0.3"
info:
  title: "rock-paper-scissors-lizard-spock-bot"
  description: >-
    Health endpoint of the Telegram bot process. The bot itself communicates
    through Telegram long polling and exposes no other HTTP API.
  version: "1.0.0"
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns 200 when the Ktor server is running.
      responses:
        "200":
          description: "OK"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "OK"
