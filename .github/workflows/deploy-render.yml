name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: "Render service ID (srv-...). Defaults to the RENDER_SERVICE_ID repository variable."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ github.event.inputs.service_id || vars.RENDER_SERVICE_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    steps:
      - name: Validate required configuration
        run: |
          set -euo pipefail
          for name in RENDER_API_KEY RENDER_SERVICE_ID BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required configuration: $name"
              exit 1
            fi
          done
          echo "Required configuration is present."

      - name: Update BOT_TOKEN on Render
        run: |
          set -euo pipefail
          jq -n --arg value "$BOT_TOKEN" '{value: $value}' |
            curl --fail-with-body --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data @- \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/BOT_TOKEN" \
              > /dev/null
          echo "Updated BOT_TOKEN on the Render service."

      - name: Update optional database settings on Render
        run: |
          set -euo pipefail
          for name in DATABASE_URL DATABASE_USER DATABASE_PASSWORD; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              jq -n --arg value "$value" '{value: $value}' |
                curl --fail-with-body --silent --show-error \
                  --request PUT \
                  --header "Authorization: Bearer ${RENDER_API_KEY}" \
                  --header "Content-Type: application/json" \
                  --data @- \
                  "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${name}" \
                  > /dev/null
              echo "Updated ${name} on the Render service."
            else
              echo "Skipping ${name}: not configured."
            fi
          done

      - name: Trigger Render deploy
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          deploy_id=$(printf '%s' "$response" | jq -r '.id // empty')
          echo "Triggered a Render deploy${deploy_id:+ (id: $deploy_id)}."
          echo "Track it at https://dashboard.render.com/web/${RENDER_SERVICE_ID}/deploys"
