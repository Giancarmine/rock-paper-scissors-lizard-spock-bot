name: Configure bot metadata

# Applies the bot's profile text through the Bot API so the storefront stays in sync
# with the repo. The `/` command menu is registered by the bot itself at startup
# (see BotCommands.kt), so this workflow does not touch it. The token comes from the
# BOT_TOKEN secret and is never printed; GitHub masks it in logs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Apply profile text
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.telegram.org/bot${BOT_TOKEN}"

          echo "### getMe"
          curl -sS "${api}/getMe" |
            jq -c '{ok, first_name: .result.first_name, username: .result.username, can_join_groups: .result.can_join_groups}'

          short_description='Play Rock–Paper–Scissors or Rock–Paper–Scissors–Lizard–Spock. Keep score and climb the leaderboard.'
          description='A small Telegram bot that plays Rock–Paper–Scissors and the extended Rock–Paper–Scissors–Lizard–Spock variant against you. Every round shows both moves and the winning relation. Play solo or in a group, then use /stats, /leaderboard, and /chat_leaderboard to track wins and climb the rankings. Open source (MIT), written in Kotlin with Ktor and tgbotapi.'
          bot_name='Rock Paper Scissors Lizard Spock'

          jq -n --arg text "$short_description" '{short_description: $text}' > short-description.json
          jq -n --arg text "$description" '{description: $text}' > description.json
          jq -n --arg name "$bot_name" '{name: $name}' > name.json

          echo "### setMyName"
          curl -sS -X POST "${api}/setMyName" \
            -H 'Content-Type: application/json' --data-binary @name.json |
            jq -c '{ok, error_code, description: .description}'

          echo "### setMyShortDescription"
          curl -sS -X POST "${api}/setMyShortDescription" \
            -H 'Content-Type: application/json' --data-binary @short-description.json |
            jq -c '{ok, description: .result, error_code, description_error: .description}'

          echo "### setMyDescription"
          curl -sS -X POST "${api}/setMyDescription" \
            -H 'Content-Type: application/json' --data-binary @description.json |
            jq -c '{ok, error_code, description: .description}'

          echo "### verify"
          curl -sS "${api}/getMyName" | jq -c '{ok, result}'
          curl -sS "${api}/getMyShortDescription" | jq -c '{ok, result}'
          curl -sS "${api}/getMyDescription" | jq -c '{ok, result}'
          curl -sS "${api}/getMyCommands" | jq -c '{ok, result}'
