name: Keep alive

# Render's free plan stops a web service after 15 minutes without inbound
# traffic. This scheduled ping keeps the bot awake while staying on the free
# tier.
#
# It targets /readyz, not /healthz, so the workflow fails when the process is
# up but the Telegram connection is dead (for example a revoked token). That
# makes a broken bot visible instead of keeping a useless process awake.
#
# Budgets must line up so a cold start is not killed halfway:
#   curl worst case = (retry + 1) * max-time + retry * retry-delay
#                   = 4 * 120s + 3 * 15s = 525s (8m45s)
#   job timeout     = 10min, leaving room for runner setup and teardown.
# Keep the job timeout comfortably above the curl budget if you change either.
#
# cancel-in-progress is false on purpose: a ping that is waiting for a sleeping
# service to wake up must be allowed to finish. A scheduled run that arrives in
# the meantime waits (at most one is queued) instead of cancelling the wake-up.
#
# Forks and clones: change READINESS_URL to your own Render URL (or remove
# this workflow if you do not host the bot on Render's free plan).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the readiness endpoint
        env:
          READINESS_URL: https://rock-paper-scissors-lizard-spock-bot.onrender.com/readyz
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            "$READINESS_URL"
          echo "Readiness check succeeded."
