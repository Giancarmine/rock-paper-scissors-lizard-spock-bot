name: Keep alive

# Render's free plan stops a web service after 15 minutes without inbound
# traffic. This scheduled ping keeps the bot awake while staying on the free
# tier. A cold start can take about a minute, so the request timeout is generous.
#
# Forks and clones: change HEALTHCHECK_URL to your own Render URL (or remove
# this workflow if you do not host the bot on Render's free plan).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          HEALTHCHECK_URL: https://rock-paper-scissors-lizard-spock-bot.onrender.com/healthz
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --max-time 150 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "$HEALTHCHECK_URL"
          echo "Health check succeeded."
